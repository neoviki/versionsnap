[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "versionsnap"
version = "1.0.0"
description = "Simple project version snapshots with list, history, diff, move, undo and delete"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Vignesh | VIKI"}]
dependencies = ["tabulate>=0.9.0"]

[project.scripts]
versionsnap = "versionsnap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
